name: CI Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-gate:
    name: backend-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure docs/ is not tracked in git
        run: |
          if [ -n "$(git ls-files docs)" ]; then
            echo "ERROR: docs/ must not be tracked in git"
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run black-box architecture gate
        run: python scripts/lint_arch.py

      - name: Run pytest
        run: |
          set +e
          pytest -v
          status=$?
          set -e
          if [ "$status" -eq 5 ]; then
            echo "No tests collected yet (bootstrap phase); treating exit code 5 as pass."
            exit 0
          fi
          exit "$status"

  mobile-gate:
    name: mobile-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Run ESLint gate
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Jest tests
        run: npm test -- --passWithNoTests
