<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bot Avatar Studio — 动态机器人头像生成器</title>
  <!-- Load Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
          },
          boxShadow: {
            'dock': '0 10px 30px -5px rgba(0, 0, 0, 0.08), 0 4px 10px -2px rgba(0, 0, 0, 0.04)',
            'popover': '0 20px 45px -10px rgba(0, 0, 0, 0.14), 0 6px 16px -4px rgba(0, 0, 0, 0.06)',
            'btn': '0 8px 20px -4px rgba(17, 24, 39, 0.22), 0 2px 6px -1px rgba(17, 24, 39, 0.12)',
          }
        }
      }
    };
  </script>
  <style>
    /* Base tactile styling & smooth theme transitions */
    :root {
      --bg-canvas: #F7F7F5;
      --bg-panel: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-card-hover: #F5F5F3;
      --border-subtle: rgba(17, 24, 39, 0.08);
      --border-active: #111827;
      --text-primary: #111827;
      --text-secondary: #6B7280;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      transition: background-color 0.35s cubic-bezier(0.22, 1, 0.36, 1), color 0.3s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Background Theme Modes */
    body.theme-studio {
      --bg-canvas: #F7F7F5;
      background-image: radial-gradient(circle at 42% 45%, rgba(255, 255, 255, 0.85) 0%, rgba(247, 247, 245, 0) 65%);
    }

    body.theme-white {
      --bg-canvas: #FFFFFF;
      background-image: none;
    }

    body.theme-dark {
      --bg-canvas: #121316;
      --bg-panel: #1B1D22;
      --bg-card: #22252B;
      --bg-card-hover: #2A2E36;
      --border-subtle: rgba(255, 255, 255, 0.09);
      --border-active: #F9FAFB;
      --text-primary: #F3F4F6;
      --text-secondary: #9CA3AF;
      background-image: radial-gradient(circle at 42% 45%, rgba(38, 42, 52, 0.55) 0%, rgba(18, 19, 22, 0) 70%);
    }

    body.theme-grid {
      --bg-canvas: #F5F5F4;
      background-color: #F8F8F7;
      background-image:
        linear-gradient(45deg, #EAEAE8 25%, transparent 25%),
        linear-gradient(-45deg, #EAEAE8 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #EAEAE8 75%),
        linear-gradient(-45deg, transparent 75%, #EAEAE8 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    }

    /* Custom subtle scrollbars for the right panel */
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.35);
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.55);
    }

    /* Tactile Card Selection Styles */
    .option-card {
      background-color: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
                  border-color 0.2s ease,
                  background-color 0.2s ease,
                  box-shadow 0.2s ease;
    }
    .option-card:hover {
      background-color: var(--bg-card-hover);
      transform: translateY(-1px);
    }
    .option-card:active {
      transform: scale(0.96);
    }
    .option-card.is-active {
      border-color: var(--border-active);
      box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.06);
    }

    /* Color Swatch Ring */
    .swatch-btn {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
    }
    .swatch-btn:hover {
      transform: scale(1.1);
    }
    .swatch-btn:active {
      transform: scale(0.94);
    }
    .swatch-btn.is-active {
      box-shadow: 0 0 0 2.5px var(--bg-panel), 0 0 0 4.5px var(--border-active);
      transform: scale(1.05);
    }

    /* Avatar Stage Ambient Shadow */
    .bot-stage-shadow {
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    /* Custom Range Slider */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: rgba(156, 163, 175, 0.28);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #111827;
      border: 2px solid #FFFFFF;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      margin-top: -5px;
      transition: transform 0.15s ease;
    }
    body.theme-dark input[type="range"]::-webkit-slider-thumb {
      background: #F9FAFB;
      border-color: #1B1D22;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    /* Popover enter/exit transition */
    .popover-panel {
      transform-origin: left center;
      transition: opacity 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .popover-hidden {
      opacity: 0;
      transform: scale(0.94) translateX(-8px);
      pointer-events: none;
    }
    .popover-visible {
      opacity: 1;
      transform: scale(1) translateX(0);
      pointer-events: auto;
    }

    /* Dropdown transition */
    .dropdown-panel {
      transform-origin: top right;
      transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .dropdown-hidden {
      opacity: 0;
      transform: scale(0.95) translateY(-6px);
      pointer-events: none;
    }
    .dropdown-visible {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: auto;
    }
  </style>
</head>
<body class="theme-studio min-h-screen lg:h-screen lg:overflow-hidden flex flex-col lg:flex-row">

  <!-- ===================================================================== -->
  <!-- 1. LEFT FLOATING DOCK (Desktop Left Center / Mobile Top Floating)     -->
  <!-- ===================================================================== -->
  <aside class="fixed top-4 left-1/2 -translate-x-1/2 lg:translate-x-0 lg:top-1/2 lg:-translate-y-1/2 lg:left-6 z-40 flex lg:flex-col items-center gap-2 p-1.5 rounded-full shadow-dock border border-black/[0.06]"
         style="background-color: var(--bg-panel);">
    <!-- Button 1: Design / Customize -->
    <button id="dock-design-btn"
            type="button"
            title="定制外观 / Customize"
            class="w-10 h-10 rounded-full flex items-center justify-center transition-all duration-200 bg-[#111827] text-white shadow-sm">
      <!-- Palette / Pen Nib Icon -->
      <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>
        <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
        <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>
        <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>
        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>
      </svg>
    </button>

    <!-- Button 2: Randomize / Shuffle -->
    <button id="dock-random-btn"
            type="button"
            title="随机灵感 / Randomize"
            class="w-10 h-10 rounded-full flex items-center justify-center transition-all duration-200 hover:bg-black/5 dark:hover:bg-white/10"
            style="color: var(--text-secondary);">
      <!-- Dice / Cube Icon -->
      <svg id="dice-icon" class="w-[18px] h-[18px] transition-transform duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="18" x="3" y="3" rx="3" ry="3"/>
        <path d="M16 8h.01"/>
        <path d="M8 8h.01"/>
        <path d="M8 16h.01"/>
        <path d="M16 16h.01"/>
        <path d="M12 12h.01"/>
      </svg>
    </button>

    <!-- Button 3: Motion & Canvas Settings -->
    <button id="dock-settings-btn"
            type="button"
            title="动态与画布设置 / Motion & Canvas"
            class="w-10 h-10 rounded-full flex items-center justify-center transition-all duration-200 hover:bg-black/5 dark:hover:bg-white/10"
            style="color: var(--text-secondary);">
      <!-- Gear Icon -->
      <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </aside>

  <!-- Floating Motion & Canvas Settings Popover -->
  <div id="settings-popover"
       class="popover-panel popover-hidden fixed top-16 left-1/2 -translate-x-1/2 lg:translate-x-0 lg:top-1/2 lg:-translate-y-1/2 lg:left-24 z-50 w-[300px] rounded-2xl p-4 shadow-popover border"
       style="background-color: var(--bg-panel); border-color: var(--border-subtle);">
    <div class="flex items-center justify-between mb-3 pb-2.5 border-b" style="border-color: var(--border-subtle);">
      <span class="text-xs font-semibold tracking-wide uppercase" style="color: var(--text-secondary);">动态与画布 · Motion & Studio</span>
      <button id="close-settings-btn" type="button" class="p-1 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 transition-colors" style="color: var(--text-secondary);">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="space-y-3.5 text-sm">
      <!-- Toggle: Autonomous Look-Around -->
      <label class="flex items-center justify-between cursor-pointer">
        <div>
          <div class="font-medium text-[13px]">无心环顾四周</div>
          <div class="text-[11px]" style="color: var(--text-secondary);">眼睛自然随机漂移与张望</div>
        </div>
        <input id="toggle-wander" type="checkbox" checked class="sr-only peer" />
        <div class="w-9 h-5 bg-gray-300 dark:bg-gray-700 rounded-full peer peer-checked:bg-[#111827] dark:peer-checked:bg-emerald-500 relative transition-colors after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:w-4 after:h-4 after:rounded-full after:transition-all peer-checked:after:translate-x-4"></div>
      </label>

      <!-- Slider: Wander Speed -->
      <div>
        <div class="flex items-center justify-between text-[12px] mb-1">
          <span class="font-medium">环顾节奏</span>
          <span id="speed-label" class="text-[11px] font-medium" style="color: var(--text-secondary);">悠闲 (1.0x)</span>
        </div>
        <input id="slider-speed" type="range" min="0.4" max="2.2" step="0.1" value="1.0" class="w-full" />
      </div>

      <!-- Toggle: Natural Blink -->
      <label class="flex items-center justify-between cursor-pointer">
        <div>
          <div class="font-medium text-[13px]">自然眨眼</div>
          <div class="text-[11px]" style="color: var(--text-secondary);">随机间隔轻眨与双眨</div>
        </div>
        <input id="toggle-blink" type="checkbox" checked class="sr-only peer" />
        <div class="w-9 h-5 bg-gray-300 dark:bg-gray-700 rounded-full peer peer-checked:bg-[#111827] dark:peer-checked:bg-emerald-500 relative transition-colors after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:w-4 after:h-4 after:rounded-full after:transition-all peer-checked:after:translate-x-4"></div>
      </label>

      <!-- Toggle: Cursor Curiosity -->
      <label class="flex items-center justify-between cursor-pointer">
        <div>
          <div class="font-medium text-[13px]">指针微好奇</div>
          <div class="text-[11px]" style="color: var(--text-secondary);">移动鼠标时短暂瞥向光标</div>
        </div>
        <input id="toggle-cursor" type="checkbox" checked class="sr-only peer" />
        <div class="w-9 h-5 bg-gray-300 dark:bg-gray-700 rounded-full peer peer-checked:bg-[#111827] dark:peer-checked:bg-emerald-500 relative transition-colors after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:w-4 after:h-4 after:rounded-full after:transition-all peer-checked:after:translate-x-4"></div>
      </label>

      <!-- Canvas Theme Switcher -->
      <div class="pt-2 border-t" style="border-color: var(--border-subtle);">
        <div class="text-[12px] font-medium mb-2">画布背景 · Background</div>
        <div class="grid grid-cols-4 gap-1.5">
          <button type="button" data-theme="theme-studio" class="theme-chip active-theme py-1.5 px-1 rounded-lg border text-[11px] font-medium text-center transition-all" style="border-color: var(--border-active);">暖白</button>
          <button type="button" data-theme="theme-white" class="theme-chip py-1.5 px-1 rounded-lg border text-[11px] font-medium text-center transition-all" style="border-color: var(--border-subtle);">纯白</button>
          <button type="button" data-theme="theme-dark" class="theme-chip py-1.5 px-1 rounded-lg border text-[11px] font-medium text-center transition-all" style="border-color: var(--border-subtle);">深空</button>
          <button type="button" data-theme="theme-grid" class="theme-chip py-1.5 px-1 rounded-lg border text-[11px] font-medium text-center transition-all" style="border-color: var(--border-subtle);">网格</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- 2. CENTER INTERACTIVE STAGE                                           -->
  <!-- ===================================================================== -->
  <main id="stage-area" class="flex-1 flex flex-col items-center justify-center relative pt-20 pb-8 lg:py-0 px-4 min-h-[420px] lg:min-h-0">
    
    <!-- Interactive Bot Avatar Wrapper -->
    <div id="bot-interactive-wrap"
         role="button"
         tabindex="0"
         aria-label="点击互动机器人头像"
         title="点我一下试试看 ✨"
         class="relative flex flex-col items-center justify-center cursor-pointer group focus:outline-none">
      
      <!-- Main Crisp Live SVG Bot -->
      <svg id="bot-svg"
           viewBox="0 0 320 320"
           class="w-[230px] h-[230px] sm:w-[265px] sm:h-[265px] lg:w-[285px] lg:h-[285px] overflow-visible drop-shadow-[0_18px_32px_rgba(0,0,0,0.08)]">
        <!-- Whole Bot Floating & Spring Transform Group -->
        <g id="bot-body-group" transform="translate(160, 160)">
          <!-- Bot Silhouette Shape -->
          <path id="bot-shape-path" d="" fill="#0F0F10" />
          
          <!-- Dynamic Eye Rig (Moves smoothly with 3D spherical curvature & blink) -->
          <g id="bot-eye-rig">
            <g id="bot-blink-group">
              <g id="bot-left-eye-wrap"></g>
              <g id="bot-right-eye-wrap"></g>
            </g>
          </g>
        </g>
      </svg>

      <!-- Soft Ground Contact Shadow -->
      <div id="bot-floor-shadow"
           class="bot-stage-shadow w-28 h-3 rounded-full bg-black/[0.07] dark:bg-black/40 blur-[4px] -mt-2"></div>
    </div>

    <!-- Split Export Action Bar (Matching Reference Button Below Avatar) -->
    <div class="relative mt-8 sm:mt-10 z-30">
      <div class="inline-flex items-stretch rounded-xl bg-[#111827] text-white shadow-btn overflow-visible">
        <!-- Primary Action: Export Transparent PNG -->
        <button id="export-primary-btn"
                type="button"
                class="flex items-center gap-2.5 pl-4 pr-3.5 py-2.5 text-[13.5px] font-medium tracking-tight rounded-l-xl hover:bg-[#1F2937] active:bg-[#0B0F19] transition-colors">
          <svg class="w-4 h-4 opacity-90" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" x2="12" y1="15" y2="3"/>
          </svg>
          <span>导出 PNG</span>
        </button>

        <!-- Vertical Hairline Divider -->
        <div class="w-[1px] bg-white/15 my-1.5"></div>

        <!-- Split Dropdown Trigger -->
        <button id="export-menu-toggle"
                type="button"
                aria-label="更多导出选项"
                class="px-2.5 py-2.5 rounded-r-xl hover:bg-[#1F2937] active:bg-[#0B0F19] transition-colors flex items-center justify-center">
          <svg id="export-chevron" class="w-3.5 h-3.5 transition-transform duration-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
      </div>

      <!-- Export Options Dropdown Menu -->
      <div id="export-dropdown"
           class="dropdown-panel dropdown-hidden absolute right-0 mt-2 w-52 rounded-xl p-1.5 shadow-popover border text-[13px]"
           style="background-color: var(--bg-panel); border-color: var(--border-subtle); color: var(--text-primary);">
        <button type="button" data-export="png-transparent" class="export-option w-full flex items-center justify-between px-3 py-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 transition-colors text-left">
          <span>导出 PNG (透明背景)</span>
          <span class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-black/5 dark:bg-white/10" style="color: var(--text-secondary);">1024px</span>
        </button>
        <button type="button" data-export="png-bg" class="export-option w-full flex items-center justify-between px-3 py-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 transition-colors text-left">
          <span>导出 PNG (带背景色)</span>
          <span class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-black/5 dark:bg-white/10" style="color: var(--text-secondary);">1024px</span>
        </button>
        <div class="my-1 border-t" style="border-color: var(--border-subtle);"></div>
        <button type="button" data-export="svg-file" class="export-option w-full flex items-center justify-between px-3 py-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 transition-colors text-left">
          <span>导出 SVG 矢量图</span>
          <span class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-black/5 dark:bg-white/10" style="color: var(--text-secondary);">矢量</span>
        </button>
        <button type="button" data-export="svg-copy" class="export-option w-full flex items-center justify-between px-3 py-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 transition-colors text-left">
          <span>复制 SVG 代码</span>
          <span class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-black/5 dark:bg-white/10" style="color: var(--text-secondary);">Copy</span>
        </button>
      </div>
    </div>

    <!-- Subtle Status Hint -->
    <p class="mt-3.5 text-[11.5px] tracking-wide opacity-60 hidden sm:block" style="color: var(--text-secondary);">
      点击头像可触发互动弹跳 · 眼睛会自动无心环顾四周
    </p>
  </main>

  <!-- ===================================================================== -->
  <!-- 3. RIGHT CUSTOMIZATION PANEL                                          -->
  <!-- ===================================================================== -->
  <section id="customizer-panel"
           class="w-full lg:w-[376px] xl:w-[400px] lg:h-screen flex-shrink-0 border-t lg:border-t-0 lg:border-l rounded-t-3xl lg:rounded-none shadow-[0_-10px_30px_rgba(0,0,0,0.04)] lg:shadow-none overflow-y-auto custom-scroll px-5 sm:px-6 py-6 space-y-6 z-20"
           style="background-color: var(--bg-panel); border-color: var(--border-subtle);">

    <!-- SECTION 1: SHAPE (4x2 Grid = 8 Shapes) -->
    <div>
      <div class="flex items-center justify-between mb-2.5">
        <h2 class="text-[13px] font-semibold tracking-tight" style="color: var(--text-primary);">
          形状 <span class="font-normal opacity-50 ml-1">Shape</span>
        </h2>
        <span id="active-shape-badge" class="text-[11px] font-medium" style="color: var(--text-secondary);">圆形 Circle</span>
      </div>
      <div id="shape-grid" class="grid grid-cols-4 gap-2.5">
        <!-- Populated dynamically by JS -->
      </div>
    </div>

    <!-- SECTION 2: EXPRESSION (4x4 Grid = 16 Expressions) -->
    <div>
      <div class="flex items-center justify-between mb-2.5">
        <h2 class="text-[13px] font-semibold tracking-tight" style="color: var(--text-primary);">
          表情 <span class="font-normal opacity-50 ml-1">Expression</span>
        </h2>

    /**
     * 5. LUMINANCE CONTRAST HELPER
     * Automatically switches eye color between crisp white (#FFFFFF) and charcoal (#141416)
     * whenever the user selects a light body color like Warm Cream (#EFECE6).
     */
    function getEyeContrastColor(hexColor) {
      const hex = hexColor.replace('#', '');
      const r = parseInt(hex.substring(0, 2), 16) / 255;
      const g = parseInt(hex.substring(2, 4), 16) / 255;
      const b = parseInt(hex.substring(4, 6), 16) / 255;
      // Perceived brightness (YIQ / Rec.601 luminance)
      const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
      return brightness > 0.72 ? '#141416' : '#FFFFFF';
    }

    /**

    const motion = {

      gazeX: 0.58,
      gazeY: -0.52,
      targetX: 0.58,
      targetY: -0.52,
      // Waypoint timing

      // Cursor curiosity state
      pointerActive: false,
      pointerX: 0,
      pointerY: 0,
      lastPointerMove: 0,
      // Natural blinking state
      blinkScaleY: 1,
      isBlinking: false,
      blinkProgress: 0,
      nextBlinkTime: performance.now() + 2600,
      queuedDoubleBlink: false,
      // Tactile spring bounce (squash & stretch)
      springScale: 0,
      springVel: 0,
      // Ambient floating clock
      elapsed: 0,
      lastFrameTime: performance.now()

    /**
     * Picks a natural, thoughtful look-around gaze target.
     * Simulates casual daydreaming: glancing up-right, pausing, drifting across,
     * checking slightly down, or resting near center.
     */
    function pickNextGazeWaypoint(now) {
      const presets = [
        { x: 0.72, y: -0.62 },  // Iconic upper-right contemplative glance
        { x: -0.68, y: -0.35 }, // Thoughtful upper-left drift
        { x: 0.45, y: 0.35 },   // Casual lower-right glance
        { x: -0.52, y: 0.42 },  // Casual lower-left glance
        { x: 0.08, y: -0.15 },  // Gentle near-center rest
        { x: 0.82, y: -0.10 },  // Sideways peek right
        { x: -0.78, y: 0.05 },  // Sideways peek left
        { x: -0.15, y: -0.65 }  // Daydreaming upward gaze
      ];

      // Choose a waypoint sufficiently distinct from current target
      let candidate = presets[Math.floor(Math.random() * presets.length)];
      if (Math.hypot(candidate.x - motion.targetX, candidate.y - motion.targetY) < 0.35) {
        candidate = presets[(presets.indexOf(candidate) + 3) % presets.length];
      }

      // Add organic micro-variation
      motion.targetX = Math.max(-0.95, Math.min(0.95, candidate.x + (Math.random() - 0.5) * 0.24));
      motion.targetY = Math.max(-0.9, Math.min(0.9, candidate.y + (Math.random() - 0.5) * 0.22));

      // Pause duration between 1.3s and 3.1s (scaled by wanderSpeed)
      const pauseMs = (1300 + Math.random() * 1800) / state.wanderSpeed;
      motion.nextWaypointTime = now + pauseMs;
    }

    function triggerBlink(allowDouble = true) {
      if (motion.isBlinking) return;
      motion.isBlinking = true;
      motion.blinkProgress = 0;
      motion.queuedDoubleBlink = allowDouble && Math.random() < 0.24;
    }

    function triggerSpringBounce(impulse = 0.09) {
      motion.springVel = impulse;
    }

    /**
     * Computes actual pixel coordinates & 3D spherical curvature transforms for the eyes
     * based on the active shape's safe interior bounds.
     */
    function computeEyeTransform(nx, ny) {
      const shapeObj = SHAPES.find((s) => s.id === state.shapeId) || SHAPES[0];
      const b = shapeObj.gazeBounds;

      // Taper horizontal excursion when looking upward into narrow top shapes (Triangle / Droplet)
      const upwardRatio = Math.max(0, -ny);
      const effectiveMaxRx = b.maxRx * (1 - upwardRatio * b.taperTop);

      const px = b.baseX + nx * effectiveMaxRx;
      const py = b.baseY + ny * b.maxRy;

      // Subtle 3D spherical curvature illusion: slight perspective scale & organic roll tilt
      const tiltDeg = nx * 7.5 + nx * (-ny) * 3.5;
      const perspScaleX = 1 - Math.abs(nx) * 0.07;
      const perspScaleY = 1 - Math.abs(ny) * 0.04;

      return { px, py, tiltDeg, perspScaleX, perspScaleY };
    }

    function animationLoop(now) {
      const dt = Math.min(0.05, (now - motion.lastFrameTime) / 1000);
      motion.lastFrameTime = now;
      motion.elapsed += dt;

      // 1. Update Gaze Target (Cursor Curiosity vs Autonomous Casual Look-Around)
      const cursorStillDuration = now - motion.lastPointerMove;
      if (state.cursorCuriosity && motion.pointerActive && cursorStillDuration < 1500) {
        motion.targetX = motion.pointerX;
        motion.targetY = motion.pointerY;
      } else if (state.wanderEnabled) {
        if (now >= motion.nextWaypointTime) {
          pickNextGazeWaypoint(now);
        }
      } else {
        // Return gently to resting center if autonomous wandering is toggled off
        motion.targetX = 0;
        motion.targetY = 0;
      }

      // Smooth critically-damped interpolation toward target gaze
      const followRate = 1 - Math.exp(-3.4 * state.wanderSpeed * dt);
      motion.gazeX += (motion.targetX - motion.gazeX) * followRate;
      motion.gazeY += (motion.targetY - motion.gazeY) * followRate;

      // 2. Update Natural Blinking
      if (state.blinkEnabled && !motion.isBlinking && now >= motion.nextBlinkTime) {
        triggerBlink(true);
        motion.nextBlinkTime = now + (2800 + Math.random() * 2800);
      }

      if (motion.isBlinking) {
        motion.blinkProgress += dt / 0.155; // Crisp 155ms natural blink
        if (motion.blinkProgress >= 1) {
          motion.blinkProgress = 0;
          motion.blinkScaleY = 1;
          motion.isBlinking = false;
          if (motion.queuedDoubleBlink) {
            motion.queuedDoubleBlink = false;
            setTimeout(() => triggerBlink(false), 110);
          }
        } else {
          // Smooth sine-squared close & open
          const wave = Math.sin(motion.blinkProgress * Math.PI);
          motion.blinkScaleY = Math.max(0.06, 1 - wave * 0.94);
        }
      }

      // 3. Update Tactile Spring Squash & Stretch Physics
      const stiffness = 260;
      const damping = 14;
      const springForce = -stiffness * motion.springScale - damping * motion.springVel;
      motion.springVel += springForce * dt;
      motion.springScale += motion.springVel * dt;

      const bodyScaleX = 1 + motion.springScale;
      const bodyScaleY = 1 - motion.springScale * 0.85;

      // 4. Ambient Subtle Floating / Breathing Motion
      const floatY = Math.sin(motion.elapsed * 1.45) * 4.5;
      const swayDeg = Math.sin(motion.elapsed * 0.95) * 1.15;

      // Apply transform to Bot Body
      botBodyGroup.setAttribute(
        'transform',
        `translate(160, ${(160 + floatY).toFixed(2)}) rotate(${swayDeg.toFixed(2)}) scale(${bodyScaleX.toFixed(4)}, ${bodyScaleY.toFixed(4)})`
      );

      // Subtle floor shadow breathing
      const shadowScale = 1 - (floatY / 4.5) * 0.08;
      botFloorShadow.style.transform = `scaleX(${shadowScale.toFixed(3)})`;

      // 5. Apply Eye Gaze Position + 3D Spherical Curvature + Inertial Follow-Through + Blink
      const { px, py, tiltDeg, perspScaleX, perspScaleY } = computeEyeTransform(motion.gazeX, motion.gazeY);
      const inertialLagY = -Math.cos(motion.elapsed * 1.45) * 1.1;

      botEyeRig.setAttribute(
        'transform',
        `translate(${px.toFixed(2)}, ${(py + inertialLagY).toFixed(2)}) rotate(${tiltDeg.toFixed(2)}) scale(${perspScaleX.toFixed(4)}, ${perspScaleY.toFixed(4)})`
      );

      botBlinkGroup.setAttribute('transform', `scale(1, ${motion.blinkScaleY.toFixed(4)})`);

      // Differential depth compression between left and right eye on curved surface
      const leftCompression = 1 - Math.max(0, -motion.gazeX) * 0.06;
      const rightCompression = 1 - Math.max(0, motion.gazeX) * 0.06;
      botLeftEyeWrap.setAttribute('transform', `scale(${leftCompression.toFixed(4)}, 1)`);
      botRightEyeWrap.setAttribute('transform', `scale(${rightCompression.toFixed(4)}, 1)`);

      requestAnimationFrame(animationLoop);
    }

    /**
     * 10. INTERACTIVE STAGE EVENTS (CLICK BOUNCE & CURSOR CURIOSITY)
     */
    botInteractiveWrap.addEventListener('click', () => {
      triggerSpringBounce(0.11);
      triggerBlink(false);
    });

    botInteractiveWrap.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        triggerSpringBounce(0.11);
        triggerBlink(false);
      }
    });

    const stageArea = document.getElementById('stage-area');
    stageArea.addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'mouse') return;
      const rect = botInteractiveWrap.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const dx = (e.clientX - centerX) / 220;
      const dy = (e.clientY - centerY) / 220;

      motion.pointerX = Math.max(-0.95, Math.min(0.95, dx));
      motion.pointerY = Math.max(-0.9, Math.min(0.9, dy));
      motion.pointerActive = true;
      motion.lastPointerMove = performance.now();
    });

    stageArea.addEventListener('pointerleave', () => {
      motion.pointerActive = false;
    });

    /**
     * 11. FLOATING DOCK & SETTINGS POPOVER CONTROLS
     */
    const dockDesignBtn = document.getElementById('dock-design-btn');
    const dockRandomBtn = document.getElementById('dock-random-btn');
    const dockSettingsBtn = document.getElementById('dock-settings-btn');
    const diceIcon = document.getElementById('dice-icon');
    const settingsPopover = document.getElementById('settings-popover');
    const closeSettingsBtn = document.getElementById('close-settings-btn');
    const customizerPanel = document.getElementById('customizer-panel');

    let diceRotation = 0;

    dockDesignBtn.addEventListener('click', () => {
      settingsPopover.classList.replace('popover-visible', 'popover-hidden');
      customizerPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    dockRandomBtn.addEventListener('click', () => {
      diceRotation += 180;
      diceIcon.style.transform = `rotate(${diceRotation}deg)`;

      // Pick random distinct shape, expression, and color
      const randomShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      const randomExp = EXPRESSIONS[Math.floor(Math.random() * EXPRESSIONS.length)];
      const randomSwatch = SWATCHES[Math.floor(Math.random() * SWATCHES.length)];

      state.shapeId = randomShape.id;
      state.expressionId = randomExp.id;
      state.color = randomSwatch.hex;
      customColorInput.value = state.color;

      triggerSpringBounce(0.11);
      triggerBlink(false);
      pickNextGazeWaypoint(performance.now());
      updateBotAppearance();
      updateActiveCards();
    });

    dockSettingsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isHidden = settingsPopover.classList.contains('popover-hidden');
      if (isHidden) {
        settingsPopover.classList.replace('popover-hidden', 'popover-visible');
      } else {
        settingsPopover.classList.replace('popover-visible', 'popover-hidden');
      }
    });

    closeSettingsBtn.addEventListener('click', () => {
      settingsPopover.classList.replace('popover-visible', 'popover-hidden');
    });

    // Motion settings bindings
    const toggleWander = document.getElementById('toggle-wander');
    const sliderSpeed = document.getElementById('slider-speed');
    const speedLabel = document.getElementById('speed-label');
    const toggleBlink = document.getElementById('toggle-blink');
    const toggleCursor = document.getElementById('toggle-cursor');

    toggleWander.addEventListener('change', (e) => {
      state.wanderEnabled = e.target.checked;
      if (state.wanderEnabled) pickNextGazeWaypoint(performance.now());
    });

    sliderSpeed.addEventListener('input', (e) => {
      state.wanderSpeed = parseFloat(e.target.value);
      const mood = state.wanderSpeed < 0.8 ? '慵懒' : state.wanderSpeed > 1.4 ? '活跃' : '悠闲';
      speedLabel.textContent = `${mood} (${state.wanderSpeed.toFixed(1)}x)`;
    });

    toggleBlink.addEventListener('change', (e) => {
      state.blinkEnabled = e.target.checked;
    });

    toggleCursor.addEventListener('change', (e) => {
      state.cursorCuriosity = e.target.checked;
    });

    // Background theme switching
    document.querySelectorAll('.theme-chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        const nextTheme = chip.dataset.theme;
        document.body.classList.remove('theme-studio', 'theme-white', 'theme-dark', 'theme-grid');
        document.body.classList.add(nextTheme);
        state.theme = nextTheme;

        document.querySelectorAll('.theme-chip').forEach((c) => {
          c.style.borderColor = c.dataset.theme === nextTheme ? 'var(--border-active)' : 'var(--border-subtle)';
        });
      });
    });

    // Custom Color Input
    customColorInput.addEventListener('input', (e) => {
      state.color = e.target.value;
      updateBotAppearance();
      updateActiveCards();
    });

    /**
     * 12. EXPORT SYSTEM (1024x1024 PNG & CRISP VECTOR SVG)
     */
    const exportPrimaryBtn = document.getElementById('export-primary-btn');
    const exportMenuToggle = document.getElementById('export-menu-toggle');
    const exportDropdown = document.getElementById('export-dropdown');
    const exportChevron = document.getElementById('export-chevron');
    const toastBanner = document.getElementById('toast-banner');
    const toastText = document.getElementById('toast-text');

    let toastTimer = null;
    function showToast(message) {
      toastText.textContent = message;
      toastBanner.classList.remove('opacity-0', 'translate-y-3');
      toastBanner.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastBanner.classList.remove('opacity-100', 'translate-y-0');
        toastBanner.classList.add('opacity-0', 'translate-y-3');
      }, 2600);
    }

    exportMenuToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const isHidden = exportDropdown.classList.contains('dropdown-hidden');
      exportDropdown.classList.toggle('dropdown-hidden', !isHidden);
      exportDropdown.classList.toggle('dropdown-visible', isHidden);
      exportChevron.style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
    });

    // Close popovers when clicking outside
    document.addEventListener('click', (e) => {
      if (!settingsPopover.contains(e.target) && !dockSettingsBtn.contains(e.target)) {
        settingsPopover.classList.replace('popover-visible', 'popover-hidden');
      }
      if (!exportDropdown.contains(e.target) && !exportMenuToggle.contains(e.target)) {
        exportDropdown.classList.replace('dropdown-visible', 'dropdown-hidden');
        exportDropdown.classList.replace('dropdown-visible', 'dropdown-hidden');
        exportChevron.style.transform = 'rotate(0deg)';
      }
    });

    /**
     * Builds a clean, standalone SVG string capturing the exact current shape,
     * color, expression, and live eye gaze position.
     */
    function buildStandaloneSVG(includeBackground = false) {
      const shapeObj = SHAPES.find((s) => s.id === state.shapeId) || SHAPES[0];
      const expObj = EXPRESSIONS.find((e) => e.id === state.expressionId) || EXPRESSIONS[0];
      const eyeFill = getEyeContrastColor(state.color);
      const eyesSvg = expObj.render(eyeFill);

      const { px, py, tiltDeg, perspScaleX, perspScaleY } = computeEyeTransform(motion.gazeX, motion.gazeY);
      const leftCompression = 1 - Math.max(0, -motion.gazeX) * 0.06;
      const rightCompression = 1 - Math.max(0, motion.gazeX) * 0.06;

      const bgColors = {
        'theme-studio': '#F7F7F5',
        'theme-white': '#FFFFFF',
        'theme-dark': '#121316',
        'theme-grid': '#F7F7F5'
      };
      const bgRect = includeBackground
        ? `<rect width="320" height="320" fill="${bgColors[state.theme] || '#F7F7F5'}" />`
        : '';

      return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="1024" height="1024">
  ${bgRect}
  <g transform="translate(160, 160)">
    <path d="${shapeObj.path}" fill="${state.color}" />
    <g transform="translate(${px.toFixed(2)}, ${py.toFixed(2)}) rotate(${tiltDeg.toFixed(2)}) scale(${perspScaleX.toFixed(4)}, ${perspScaleY.toFixed(4)})">
      <g transform="scale(${leftCompression.toFixed(4)}, 1)">${eyesSvg.left}</g>
      <g transform="scale(${rightCompression.toFixed(4)}, 1)">${eyesSvg.right}</g>
    </g>
  </g>
</svg>`;
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function exportAsPNG(includeBackground = false) {
      const svgMarkup = buildStandaloneSVG(includeBackground);
      const svgBlob = new Blob([svgMarkup], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();

      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, 1024, 1024);
        URL.revokeObjectURL(url);

        canvas.toBlob((pngBlob) => {
          if (pngBlob) {
            const suffix = includeBackground ? 'studio' : 'transparent';
            downloadBlob(pngBlob, `bot-avatar-${state.shapeId}-${suffix}.png`);
            showToast(`已导出 1024×1024 ${includeBackground ? '带背景色' : '透明背景'} PNG`);
          }
        }, 'image/png');
      };
      img.src = url;
    }

    function exportAsSVG() {
      const svgMarkup = buildStandaloneSVG(false);
      const blob = new Blob([svgMarkup], { type: 'image/svg+xml;charset=utf-8' });
      downloadBlob(blob, `bot-avatar-${state.shapeId}.svg`);
      showToast('已导出 SVG 矢量图');
    }

    function copySVGCode() {
      const svgMarkup = buildStandaloneSVG(false);
      const textarea = document.createElement('textarea');
      textarea.value = svgMarkup;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('SVG 矢量代码已复制到剪贴板');
      } catch (err) {
        showToast('复制失败，请尝试导出 SVG 文件');
      }
      document.body.removeChild(textarea);
    }

    exportPrimaryBtn.addEventListener('click', () => exportAsPNG(false));

    document.querySelectorAll('.export-option').forEach((opt) => {
      opt.addEventListener('click', () => {
        const mode = opt.dataset.export;
        exportDropdown.classList.replace('dropdown-visible', 'dropdown-hidden');
        exportChevron.style.transform = 'rotate(0deg)';

        if (mode === 'png-transparent') exportAsPNG(false);
        else if (mode === 'png-bg') exportAsPNG(true);
        else if (mode === 'svg-file') exportAsSVG();
        else if (mode === 'svg-copy') copySVGCode();
      });
    });

    /**
     * 13. INITIALIZE ON WINDOW LOAD
     */
    window.addEventListener('load', () => {
      renderShapeCards();
      renderExpressionCards();
      renderColorSwatches();
      updateBotAppearance();
      updateActiveCards();
      requestAnimationFrame(animationLoop);
    });
  </script>
</body>
</html>
